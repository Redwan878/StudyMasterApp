name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create (e.g. v0.1.0). Leave blank to only attach an artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release.apk \
             "build-output/StudyMaster-${GITHUB_REF_NAME:-manual-$(date +%Y%m%d-%H%M%S)}.apk"
          ls -la build-output

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMaster-release-apk
          path: build-output/*.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: build-output/*.apk
